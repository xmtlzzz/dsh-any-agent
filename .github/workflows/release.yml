name: release

# A pushed version tag (vX.Y.Z) turns into:
#   1. an npm publish from CI with provenance, via npm Trusted Publishing (OIDC);
#      the job ends only once npm actually serves the version;
#   2. then a GitHub Release whose notes are that version's CHANGELOG section
#      (scripts/release-notes.mjs), not GitHub's one-line "generated notes";
#   3. and a listing in the official MCP Registry (server.json).
#
# The Release waits for npm because whatever rebuilds on a new GitHub Release (Glama's
# auto-release runs `npm install -g dsh-any-agent`) would otherwise install the previous
# version: v0.6.4's Release was public ~2.7 min before npm served the package.
#
# Trusted Publishing needs a one-time setup on npmjs.com:
#   package dsh-any-agent → Settings → Trusted Publisher → GitHub Actions,
#   repository xmtlzzz/dsh-any-agent, workflow file "release.yml".
# No NPM_TOKEN secret is used. Until that is configured, the npm job fails with an
# auth error and no GitHub Release is created; publish manually, then re-run (npm is
# skipped and the Release is created).
#
# Optional gate: when the repository variable MODEL_SUITE_RUNNER names a runner that has
# DSH, a provider and credentials (a self-hosted label), the full model-backed suite
# (`node test/run.mjs --all`) runs on the tagged commit first and npm publish waits for
# it. A failure there stops the release before anything is published. Without the
# variable the job is skipped and the release proceeds as before.
#
# Both jobs are idempotent: re-running (or workflow_dispatch with an existing tag)
# refreshes the Release notes and skips npm if that version is already published.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)publish, e.g. v0.6.2'
        required: true

permissions:
  contents: read

jobs:
  model-suites:
    name: model suites on the tagged commit (only with MODEL_SUITE_RUNNER)
    # Tag pushes only: re-running an old tag by hand (to refresh Release notes) must not re-run the suites.
    if: ${{ vars.MODEL_SUITE_RUNNER != '' && github.event_name == 'push' }}
    runs-on: ${{ vars.MODEL_SUITE_RUNNER }}
    # Live DSH suites must never overlap: cleanup.mjs deletes every test session.
    concurrency:
      group: dsh-model-suites
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: detect DSH (same discovery the server uses)
        id: dsh
        env:
          DSH_BIN: ${{ secrets.DSH_BIN }}
        run: node scripts/detect-dsh.mjs

      # The runner was named explicitly as "has DSH", so not finding it is a failure
      # here (in model-suites.yml it is only a skip).
      - name: DSH must be present on this runner
        if: steps.dsh.outputs.ok != '1'
        run: node -e "console.error('MODEL_SUITE_RUNNER is set but DSH was not found on it'); process.exit(1)"

      - name: run offline + model suites
        env:
          DSH_BIN: ${{ secrets.DSH_BIN }}
          DSH_MCP_LOG: silent
        run: node test/run.mjs --all

      - name: installed tarball MCP lifecycle with real DSH
        env:
          DSH_BIN: ${{ secrets.DSH_BIN }}
          DSH_MCP_LOG: silent
        run: npm run test:packed -- --real

  # `needs` + a skipped ancestor: the default `success()` is false for every job downstream
  # of a skipped one, so the three jobs below spell their condition out.
  github-release:
    name: GitHub Release (notes from CHANGELOG)
    needs: npm-publish
    if: ${{ !cancelled() && needs.npm-publish.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.tag.outputs.tag }}
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Build notes from CHANGELOG
        run: node scripts/release-notes.mjs "${{ steps.tag.outputs.version }}" --out "$RUNNER_TEMP/notes.md"

      - name: Create or update the Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
            echo "Updated notes for existing release $TAG"
          else
            gh release create "$TAG" --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag
            echo "Created release $TAG"
          fi

  npm-publish:
    name: npm publish (provenance)
    needs: model-suites
    if: ${{ !cancelled() && (needs.model-suites.result == 'success' || needs.model-suites.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC token for npm Trusted Publishing + provenance
    steps:
      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # Trusted Publishing needs npm CLI >= 11.5.1.
      - name: Ensure a recent npm
        shell: bash
        run: |
          set -euo pipefail
          need=11.5.1
          have=$(npm --version)
          if [ "$(printf '%s\n%s\n' "$need" "$have" | sort -V | head -n1)" != "$need" ]; then
            npm install -g "npm@^11.5.1"
          fi
          npm --version

      - name: Tag must match package.json
        shell: bash
        run: |
          set -euo pipefail
          pkg=$(node -p "require('./package.json').version")
          if [ "$pkg" != "${{ steps.tag.outputs.version }}" ]; then
            echo "::error::tag ${{ steps.tag.outputs.tag }} but package.json is $pkg"
            exit 1
          fi

      - name: Already on npm?
        id: exists
        shell: bash
        run: |
          set -euo pipefail
          v="${{ steps.tag.outputs.version }}"
          if npm view "dsh-any-agent@$v" version >/dev/null 2>&1; then
            echo "dsh-any-agent@$v is already published; skipping."
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Release gate (version, CHANGELOG, docs links) + package check
        if: steps.exists.outputs.published == 'false'
        env: { DSH_MCP_LOG: silent }
        run: |
          npm run check:release
          node test/package-check.mjs
          npm run test:packed
          npm run test:packed -- --upgrade

      - name: Publish
        if: steps.exists.outputs.published == 'false'
        run: npm publish --provenance --access public

      # npm makes a new version visible asynchronously (PUT 202): right after the publish
      # a lookup still gets a 404 ("version '…' was not found"). This happened on the
      # first v0.6.3 run. Both later jobs need npm to serve the version, so wait here,
      # up to 10 min.
      - name: Wait for the version on npm
        shell: bash
        run: |
          set -euo pipefail
          v="${{ steps.tag.outputs.version }}"
          for i in $(seq 1 40); do
            if npm view "dsh-any-agent@$v" version --prefer-online >/dev/null 2>&1; then
              echo "npm serves dsh-any-agent@$v (after ~$(( (i - 1) * 15 ))s)"
              exit 0
            fi
            sleep 15
          done
          echo "::error::dsh-any-agent@$v is still not visible on npm after 10 minutes"
          exit 1

  # MCP Registry (registry.modelcontextprotocol.io): register server.json once the
  # version is on npm — the registry validates ownership through the "mcpName" field
  # inside the published npm package. Login uses this workflow's GitHub OIDC token,
  # which grants the io.github.xmtlzzz/* namespace; no secret is stored.
  mcp-registry:
    name: MCP Registry
    needs: npm-publish
    if: ${{ !cancelled() && needs.npm-publish.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      MCP_PUBLISHER_VERSION: v1.8.1
    steps:
      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.tag.outputs.tag }}

      # npm-publish (needs) already waited until npm serves the version.
      - name: Install cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Install mcp-publisher (signature-verified)
        shell: bash
        run: |
          set -euo pipefail
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          arch="$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
          archive="mcp-publisher_${os}_${arch}.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          ./mcp-publisher --help > /dev/null

      - name: Log in with GitHub OIDC
        run: ./mcp-publisher login github-oidc

      - name: Publish server.json
        run: ./mcp-publisher publish
