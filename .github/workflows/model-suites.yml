name: model-suites

# Model-backed suites need a real DSH install, a configured provider and
# credentials. GitHub-hosted runners do not have those, so this workflow is
# manual and expects a self-hosted runner label that does.
#
# DSH is found the way the server itself finds it (src/dsh-locate.mjs
# resolveDsh(): desktop app, npm global, npx cache), so a runner that only has the
# desktop app installed needs no secrets. The DSH_BIN secret is an optional override.
on:
  workflow_dispatch:
    inputs:
      runner:
        description: 'Runner label with DSH + a working provider (e.g. self-hosted)'
        required: false
        default: 'ubuntu-latest'
        type: string

permissions:
  contents: read

jobs:
  model:
    name: full model-backed suite
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # 用项目自己的 resolveDsh() 判定（src/dsh-locate.mjs，与服务启动时同一套逻辑）：
      # 桌面版（注册表 / 默认安装路径）、npm 全局、npx 缓存都认，所以只装了桌面版、
      # PATH 里没有 `dsh` 的自托管 runner 不需要任何 secret 就能跑。
      # DSH_BIN secret 仍然可选：设了就当显式覆盖；没设时 secrets.DSH_BIN 是空串，被当作未设置。
      # 不指定 shell：`node scripts/detect-dsh.mjs` 在 Linux 的 bash 与 Windows 的 pwsh 里写法一致，
      # 也就不依赖 runner 上装了 Git Bash。
      - name: detect DSH (same discovery the server uses)
        id: dsh
        env:
          DSH_BIN: ${{ secrets.DSH_BIN }}
        run: node scripts/detect-dsh.mjs

      - name: run offline + model suites
        if: steps.dsh.outputs.ok == '1'
        env:
          DSH_BIN: ${{ secrets.DSH_BIN }}
          DSH_MCP_LOG: silent
        run: node test/run.mjs --all

      - name: explain the skip
        if: steps.dsh.outputs.ok != '1'
        run: |
          echo "Model suites were skipped: this runner cannot start DSH."
          echo "Run locally with a configured DSH: node test/run.mjs --all"
