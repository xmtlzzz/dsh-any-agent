name: tests

# SCOPE -- read this before trusting a green check.
#
# This project's suite has two halves, and only one of them can run here.
#
#   OFFLINE (runs in CI)
#     smoke             protocol + instructions length cap, no DSH   38 checks
#     line-decoder      UTF-8 chunk boundaries          4 checks
#     progress          MCP progress notifications     15 checks
#     guards            env-var edge cases            40 checks
#     dsh-locate        DSH auto-discovery (asar)     21 checks
#     prune             sentinel retention            11 checks
#     approval-details  credential redaction          37 checks
#     failure-terminal  terminal state on failure     10 checks
#     shared-host       shared process host           34 checks
#     resume-retry      cold-resume timeout retry     65 checks (fake ACP server)
#     dispatch-tools    dispatch surface              69 checks (64 off Windows)
#     read-cursor       dsh_read cursor + answer      26 checks
#     sentinel-redaction sentinel disk hygiene        19 checks
#     live-events       live event stream, write side  43 checks
#     live-view         watch / dashboard viewers      69 checks
#     release-notes     Release notes from CHANGELOG   12 checks
#     review            caller review tickets        70 checks
#     forget-tombstone  forget is terminal            25 checks
#     bootstrap-profile zero-dependency bootstrap     27 checks
#     workspace-safety  data-loss boundaries          23 checks
#     residue-purge     test residue cleanup, sandboxed 158 checks
#     permission-adopt  no silent privilege escalation 22 checks
#     state-safety      state/sentinel/lock storage   26 checks
#     workspace-snapshot workspace_changed full fingerprint  27 checks
#     sandbox-guard     real HOME is never a sandbox   21 checks
#     commit-script     commit via stdin, no temp    26 checks
#     test-counts       report parser + docs sync     92 checks
#     roots             cwd from MCP roots            18 checks
#     workspace-titles  home/root cwd guard, title_hint 19 checks (17 off Windows)
#     setup             client config writer          45 checks
#     removal-scope     --remove only touches its own   61 checks
#     config-safety     in-place edits, format        442 checks
#     real-configs      real config round-trip        skips without client fixtures
#     package-check     publishability                15 checks
#     lint              static checks (npm run lint)  syntax, imports, exports, unused
#     lint (selftest)   scripts/lint.mjs regression   22 checks
#     package job       pack -> install -> --version
#     website job       build + 29 site/a11y tests + bilingual pages
#
#     These load modules and touch the filesystem: no DSH, no model, no
#     credentials.
#
#     The check counts above are written by scripts/sync-test-counts.mjs
#     (npm run docs:counts) from the JSON report test/run.mjs produces, not
#     typed by hand. The numbers are what a hosted runner measures: no DSH and
#     no client config fixtures (hence smoke's session sections and
#     real-configs do not run). The last step of the offline job re-runs the
#     suites with --report and fails if the docs disagree.
#
#   NEEDS DSH (does NOT run in CI)
#     boundary, integration, async, sentinel, timeout, lock, cycle,
#     concurrency, capability, workspace-effect, acceptance, multi,
#     permission, list, reasoning-check, shared-process
#
#     Each spawns a real DSH process. smoke is in the offline job: it runs
#     handshake/tools/list/unknown-tool checks and skips session sections when
#     DSH is absent. Full model suites: `npm run test:all` locally, or the
#     model-suites workflow with a self-hosted DSH runner.
#
# A green run means the protocol surface is intact, the safety guards hold,
# and the tarball installs. It does not mean agent behaviour was exercised.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# The repository root IS the package root: <repo>/bin, <repo>/src, <repo>/test.
# Do not add 'working-directory: server' -- no such directory exists in a
# fresh checkout, and every run step then fails before its first command.

# Text shown to the caller follows the system language; the suites assert on the Chinese text,
# so every job pins it (the English checks pass DSH_MCP_LANG=en themselves).
env:
  DSH_MCP_LANG: zh

jobs:
  offline-suites:
    name: offline (${{ matrix.os }} / node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # 22 is the floor: src/workspace.mjs imports zstdDecompressSync from
        # node:zlib, which does not exist before Node 22.15. Node 20 therefore
        # cannot even load the server -- tested and confirmed by CI failing
        # with 'server exited code 1' before it answered a single request.
        node: ['22', '24']
        # macOS has darwin-specific config paths; run one representative cell.
        include:
          - os: macos-latest
            node: '22'

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      # Proves the suite really is DSH-independent: if one of these needed
      # DSH, that would be a silent skip, not a visible failure.
      - name: confirm no DSH on this runner
        shell: bash
        run: |
          if command -v dsh > /dev/null 2>&1; then echo 'dsh unexpectedly present'; exit 1; fi
          echo 'no dsh on PATH, as expected'

      # 零依赖静态检查：语法、相对导入路径（含大小写）、具名导出是否存在、未使用导入。
      # 放在最前面：拆模块 / 改导入留下的一个漏导出，比任何一个套件都更早、更便宜地暴露。
      # 在 Linux 上跑的价值最大 —— Windows/macOS 不区分大小写，只有这里会抓到
      # `./Foo.mjs` 与 `foo.mjs` 的写法不一致。
      - name: lint (syntax, imports resolve, named exports exist, no unused imports)
        run: npm run lint

      - name: lint selftest (every rule fires, valid syntax is not flagged)
        env: { DSH_MCP_LOG: silent }
        run: node test/lint.mjs

      - name: smoke (protocol; skips DSH session sections on this runner)
        env: { DSH_MCP_LOG: silent, DSH_BIN: '/fake/never/used.js' }
        run: node test/smoke.mjs

      - name: line-decoder (multi-byte UTF-8 chunk boundaries)
        env: { DSH_MCP_LOG: silent }
        run: node test/line-decoder.mjs

      - name: progress (MCP progress notifications)
        env: { DSH_MCP_LOG: silent }
        run: node test/progress.mjs

      - name: guards (environment-variable edge cases)
        env: { DSH_MCP_LOG: silent }
        run: node test/guards.mjs

      - name: dsh-locate (DSH auto-discovery, synthetic asar)
        env: { DSH_MCP_LOG: silent }
        run: node test/dsh-locate.mjs

      - name: prune (sentinel retention)
        env: { DSH_MCP_LOG: silent }
        run: node test/prune.mjs

      - name: approval-details (credential redaction)
        env: { DSH_MCP_LOG: silent }
        run: node test/approval-details.mjs

      - name: failure-terminal (terminal state on failure)
        env: { DSH_MCP_LOG: silent }
        run: node test/failure-terminal.mjs

      - name: shared-host (shared process host)
        env: { DSH_MCP_LOG: silent }
        run: node test/shared-host.mjs

      # 假 ACP 服务端当 DSH：resume 停滞时重试一次，撞写锁/参数错误不重试。
      - name: resume-retry (cold-resume timeout retry boundaries)
        env: { DSH_MCP_LOG: silent }
        run: node test/resume-retry.mjs

      - name: dispatch-tools (dsh_inbox, idempotency, queue)
        env: { DSH_MCP_LOG: silent }
        run: node test/dispatch-tools.mjs

      - name: read-cursor (revision cursor semantics)
        env: { DSH_MCP_LOG: silent }
        run: node test/read-cursor.mjs

      - name: sentinel-redaction (thinking/input hygiene)
        env: { DSH_MCP_LOG: silent }
        run: node test/sentinel-redaction.mjs

      # live 事件流：假 hub + 假 ACP 进程，思考不落盘、预览脱敏、写失败不影响派活。
      - name: live-events (live event stream, write side)
        env: { DSH_MCP_LOG: silent }
        run: node test/live-events.mjs

      # 查看端：增量 tail、watch --once 走 bin 入口、dashboard 的 token / Host / 只读校验。
      - name: live-view (watch / dashboard, read-only viewers)
        env: { DSH_MCP_LOG: silent }
        run: node test/live-view.mjs

      - name: release-notes (GitHub Release notes from the CHANGELOG section)
        env: { DSH_MCP_LOG: silent }
        run: node test/release-notes.mjs

      - name: review (caller review tickets, verdicts, sentinel rewrite)
        env: { DSH_MCP_LOG: silent }
        run: node test/review.mjs

      - name: forget-tombstone (forget is terminal)
        env: { DSH_MCP_LOG: silent }
        run: node test/forget-tombstone.mjs

      - name: bootstrap-profile (zero-dependency first-run profile)
        env: { DSH_MCP_LOG: silent }
        run: node test/bootstrap-profile.mjs

      - name: workspace-safety (no data-loss on bad registry/temp prefixes)
        env: { DSH_MCP_LOG: silent }
        run: node test/workspace-safety.mjs

      # Test-session cleanup: every artifact kind a test session leaves behind
      # (DSH session log, projection cache, workspace registration, tombstone,
      # registry entry, meta, sentinels, reviews, lock markers) is removed, and
      # non-test sessions stay byte-identical. Sandboxed DSH_HOME; no DSH needed.
      - name: residue-purge (test residue cleanup is complete and scoped)
        env: { DSH_MCP_LOG: silent }
        run: node test/residue-purge.mjs

      - name: permission-adopt (no silent privilege escalation)
        env: { DSH_MCP_LOG: silent }
        run: node test/permission-adopt.mjs

      - name: state-safety (state/sentinel/lock storage)
        env: { DSH_MCP_LOG: silent }
        run: node test/state-safety.mjs

      # workspace_changed：比较必须覆盖全量条目（同一状态行但内容变了、
      # 第 41 条之后的改动、未跟踪目录内部），且 gitStatus 不能阻塞事件循环。
      - name: workspace-snapshot (full fingerprint, async gitStatus)
        env: { DSH_MCP_LOG: silent }
        run: node test/workspace-snapshot.mjs

      # Guards the sandbox itself, not the writer. A test suite that points its
      # "sandbox" at the real user profile deletes real data while reporting
      # green; this suite fails instead.
      - name: sandbox-guard (real HOME is never a sandbox)
        env: { DSH_MCP_LOG: silent }
        run: node test/sandbox-guard.mjs

      - name: setup (client config writer)
        env: { DSH_MCP_LOG: silent }
        run: node test/setup.mjs

      - name: removal-scope (--remove touches only its own entry)
        env: { DSH_MCP_LOG: silent }
        run: node test/removal-scope.mjs

      # 9 个客户端 × 格式保留(2/4 空格、单行、CRLF、BOM) × 只读文件 ×
      # 坏 JSON × 幂等 × 真实 HOME 只读回归。用户的底线是「注册/删除只能
      # 影响自己写的那一条」，这是它的可执行版本。
      - name: config-safety (in-place edits, format preserved)
        env: { DSH_MCP_LOG: silent }
        run: node test/config-safety.mjs

      # 提交脚本：信息走 stdin，不落盘。曾经把临时文件卷进发布提交三次。
      - name: commit-script (message via stdin, no temp file)
        env: { DSH_MCP_LOG: silent }
        run: node test/commit-script.mjs

      # 检查数同步的回归：解析各套件的汇总行、把报告写回文档。纯文件系统，不花 token。
      - name: test-counts (report parser and docs sync)
        env: { DSH_MCP_LOG: silent }
        run: node test/test-counts.mjs

      # MCP roots：不传 cwd 时用客户端当前打开的项目目录。真实 stdio 握手，
      # 不需要 DSH 也不需要模型。
      - name: roots (cwd defaults to the client project dir)
        env: { DSH_MCP_LOG: silent }
        run: node test/roots.mjs

      # 工作区选家目录会被提前拦住（DSH 的 ACL 沙箱要求 temp 在工作区外），
      # 以及 title_hint 与 DSH 自动标题分成两个字段返回。纯模块加载，不拉 DSH。
      - name: workspace-titles (home cwd guard, title_hint)
        env: { DSH_MCP_LOG: silent }
        run: node test/workspace-titles.mjs

      # 真实客户端配置的往返：跑在 CI runner 上通常是空的，套件会明确打印
      # skipped 而不是假绿；在开发机上跑才能真正覆盖到真实文件。
      - name: real-configs (round-trip against real client configs, if any)
        env: { DSH_MCP_LOG: silent }
        run: node test/real-configs.mjs

      # 默认分支上是计划模式：跑一遍真实 HOME，只读，证明「预览不写盘」。
      - name: preview against the real home writes nothing
        shell: bash
        env: { DSH_MCP_LOG: silent }
        run: node bin/setup.mjs --json > /dev/null

      - name: package-check (publishability)
        run: node test/package-check.mjs

      - name: version and help answer without side effects
        shell: bash
        run: |
          node bin/dsh-any-agent.mjs --version
          node bin/dsh-any-agent.mjs --help > /dev/null
          node bin/setup.mjs --version
          node bin/restore.mjs --help > /dev/null

      # 文档里的检查数不手抄：把离线套件再跑一遍产出 JSON 报告，然后核对文档。
      # --portable 只核对与环境无关的套件，以及 smoke / config-safety 在 runner 这一格
      # （没有 DSH、没有客户端配置）；dispatch-tools / workspace-titles 随平台与文件系统变化，
      # 留给本机的完整检查（发版清单里的 npm run docs:counts:check）。
      # 代价：离线套件在每个矩阵格里多跑一遍（各格并行，约一分钟），换来文档数字不会无声地漂。
      - name: docs test counts match this run (portable suites)
        shell: bash
        env: { DSH_MCP_LOG: silent, DSH_BIN: '/fake/never/used.js' }
        run: |
          node test/run.mjs --report .state/ci-report.json
          node scripts/sync-test-counts.mjs --check --portable --report .state/ci-report.json

  package:
    name: tarball installs and starts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: package.json and bin sanity
        run: node test/package-check.mjs

      - name: pack, install into a scratch project, run it
        shell: bash
        run: |
          set -euo pipefail
          npm pack --pack-destination "$RUNNER_TEMP"
          tgz=$(ls "$RUNNER_TEMP"/dsh-any-agent-*.tgz | head -1)
          mkdir -p "$RUNNER_TEMP/consumer"
          cd "$RUNNER_TEMP/consumer"
          npm init -y > /dev/null
          npm install "$tgz" --no-audit --no-fund
          test -x node_modules/.bin/dsh-any-agent
          test -x node_modules/.bin/dsh-any-agent-setup
          test -x node_modules/.bin/dsh-any-agent-restore
          node_modules/.bin/dsh-any-agent --version
          node_modules/.bin/dsh-any-agent-setup --help > /dev/null

      - name: tarball carries no state, tests, or credentials
        shell: bash
        run: |
          set -euo pipefail
          npm pack --pack-destination "$RUNNER_TEMP" > /dev/null
          tgz=$(ls "$RUNNER_TEMP"/dsh-any-agent-*.tgz | head -1)
          listing=$(tar -tzf "$tgz")
          for forbidden in "package/state/" "package/test/" "package/.state/" "package/.npmrc" "package/.birdview"; do
            if echo "$listing" | grep -qF "$forbidden"; then echo "tarball contains $forbidden"; exit 1; fi
          done
          if tar -xzOf "$tgz" | grep -qE 'sk-[A-Za-z0-9]{20,}'; then
            echo 'tarball looks like it contains a credential'; exit 1
          fi
          echo 'tarball contents ok'

  website:
    name: website build + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      # The site has no runtime dependencies; build (hash assets, CSP/SEO checks)
      # and run its node:test suite. Do not deploy from CI -- deploys are manual.
      - name: build and test
        working-directory: website
        run: npm run check

  node-floor:
    name: Node 22.15 floor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # The declared floor, not the latest 22.x. Proves zstdDecompressSync
          # is actually available at the version users are told to install.
          node-version: '22.15'
      - name: floor checks
        env: { DSH_MCP_LOG: silent }
        run: |
          node --version
          node test/package-check.mjs
          # 具名导入（含 node:zlib 的 zstdDecompressSync）要对照这个版本的真实导出检查。
          node scripts/lint.mjs
          node test/workspace-safety.mjs
          node test/bootstrap-profile.mjs