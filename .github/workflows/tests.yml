name: tests

# SCOPE -- read this before trusting a green check.
#
# This project's suite has two halves, and only one of them can run here.
#
#   OFFLINE (runs in CI)
#     guards            env-var edge cases            31 checks
#     prune             sentinel retention            11 checks
#     approval-details  credential redaction          24 checks
#     setup             client config writer          35 checks
#     package-check     publishability                12 checks
#     package job       pack -> install -> --version
#
#     These load modules and touch the filesystem: no DSH, no model, no
#     credentials.
#
#   NEEDS DSH (does NOT run in CI)
#     smoke, boundary, integration, async, sentinel, timeout, lock, cycle,
#     concurrency, capability, workspace-effect, acceptance, multi,
#     permission, list
#
#     Each spawns a real DSH process. smoke is only partly protocol: its
#     sections 1-2 (handshake, tool table) pass without DSH, then it calls
#     dsh_start and fails with 'DSH CLI entry not found'. Run locally:
#         npm test -- --all
#
# A green run means the protocol surface is intact, the safety guards hold,
# and the tarball installs. It does not mean agent behaviour was exercised.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# The repository root IS the package root: <repo>/bin, <repo>/src, <repo>/test.
# Do not add 'working-directory: server' -- no such directory exists in a
# fresh checkout, and every run step then fails before its first command.

jobs:
  offline-suites:
    name: offline (${{ matrix.os }} / node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # 22 is the floor: src/workspace.mjs imports zstdDecompressSync from
        # node:zlib, which does not exist before Node 22.15. Node 20 therefore
        # cannot even load the server -- tested and confirmed by CI failing
        # with 'server exited code 1' before it answered a single request.
        node: ['22', '24']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # Proves the suite really is DSH-independent: if one of these needed
      # DSH, that would be a silent skip, not a visible failure.
      - name: confirm no DSH on this runner
        shell: bash
        run: |
          if command -v dsh > /dev/null 2>&1; then echo 'dsh unexpectedly present'; exit 1; fi
          echo 'no dsh on PATH, as expected'

      - name: guards (environment-variable edge cases)
        env: { DSH_MCP_LOG: silent }
        run: node test/guards.mjs

      - name: prune (sentinel retention)
        env: { DSH_MCP_LOG: silent }
        run: node test/prune.mjs

      - name: approval-details (credential redaction)
        env: { DSH_MCP_LOG: silent }
        run: node test/approval-details.mjs

      - name: setup (client config writer)
        env: { DSH_MCP_LOG: silent }
        run: node test/setup.mjs

      - name: package-check (publishability)
        run: node test/package-check.mjs

      - name: version and help answer without side effects
        shell: bash
        run: |
          node bin/dsh-any-agent.mjs --version
          node bin/dsh-any-agent.mjs --help > /dev/null
          node bin/setup.mjs --version

  package:
    name: tarball installs and starts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: package.json and bin sanity
        run: node test/package-check.mjs

      - name: pack, install into a scratch project, run it
        shell: bash
        run: |
          set -euo pipefail
          npm pack --pack-destination "$RUNNER_TEMP"
          tgz=$(ls "$RUNNER_TEMP"/dsh-any-agent-*.tgz | head -1)
          mkdir -p "$RUNNER_TEMP/consumer"
          cd "$RUNNER_TEMP/consumer"
          npm init -y > /dev/null
          npm install "$tgz" --no-audit --no-fund
          test -x node_modules/.bin/dsh-any-agent
          test -x node_modules/.bin/dsh-any-agent-setup
          node_modules/.bin/dsh-any-agent --version
          node_modules/.bin/dsh-any-agent-setup --help > /dev/null

      - name: tarball carries no state, tests, or credentials
        shell: bash
        run: |
          set -euo pipefail
          npm pack --pack-destination "$RUNNER_TEMP" > /dev/null
          tgz=$(ls "$RUNNER_TEMP"/dsh-any-agent-*.tgz | head -1)
          listing=$(tar -tzf "$tgz")
          for forbidden in "package/state/" "package/test/" "package/.state/" "package/.npmrc" "package/.birdview"; do
            if echo "$listing" | grep -qF "$forbidden"; then echo "tarball contains $forbidden"; exit 1; fi
          done
          if tar -xzOf "$tgz" | grep -qE 'sk-[A-Za-z0-9]{20,}'; then
            echo 'tarball looks like it contains a credential'; exit 1
          fi
          echo 'tarball contents ok'
